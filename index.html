    <title>BOM Store - Luxury sneakers, delivered across Egypt</title>
    <meta name="description" content="BOM Store: authentic luxury sneakers from the brands you know. Cash on delivery, delivery across Egypt, and the price of delivery shown before you pay." />
    <script>
      // Arabic is the default (hardcoded on <html> above), but a visitor who
      // picked English used to get a full RTL page until LanguageContext ran
      // after mount. Read the same key it stores and correct the document
      // before first paint. Keep in sync with LANG_KEY in
      // src/contexts/LanguageContext.tsx.
      try {
        if (localStorage.getItem('bom-store-lang') === 'en') {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
      } catch (e) { /* localStorage unavailable in private mode: keep the Arabic default */ }
    </script>
